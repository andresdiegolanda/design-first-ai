<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{COMMENT}}
  Generated by kit/build.py from template.html, style.css, engine.js and the data_*.js files. Edit those, not this file.
  One static page, no external dependencies, nothing sent anywhere. Every document, prompt and excerpt shown is
  illustrative and says so.
-->
<style>
{{CSS}}
</style>
</head>
<body>
<header>
  <h1>{{H1}}<small>{{H1SMALL}}</small></h1>
  <nav class="switch" title="{{SWITCHTITLE}}">{{SWITCH}}</nav>
  <span class="sep"></span>
  <button class="btn" id="b-reset" title="Start over: stop the journey, clear every highlight, show the whole scene (R)">↺ Start over</button>
  <button class="btn" id="b-tokens" title="{{THINGSTITLE}}">{{THINGS}}</button>
  <button class="btn" id="b-holds" title="Show or hide what each component holds (T)">Held</button>
  <button class="btn" id="b-marks" title="Show or hide the marks on the components (M)">{{MARKS}}</button>
  <button class="btn" id="b-legend">Legend</button>
  <button class="btn" id="b-howto">How to use</button>
  <button class="btn" id="b-learn" title="Transcript, self-test, glossary, and how to make a page like this">Learn ▾</button>
</header>
<main>
  <nav id="journeys"><h2>Journeys</h2><div class="sub">{{JSUB}}</div><div id="journey-list"></div><div class="foot"><kbd>→</kbd> next stop · <kbd>←</kbd> back · <kbd>space</kbd> play<br><kbd>1</kbd>–<kbd>9</kbd> pick a journey · <kbd>F</kbd> fit · <kbd>R</kbd> start over · <kbd>Esc</kbd> close</div></nav>
  <div id="canvas">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
        <marker id="arr-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow sec"/></marker>
        <marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow bad"/></marker>
        <marker id="arr-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow new"/></marker>
        <marker id="arr-dot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow dot"/></marker>
      </defs>
      <g id="world">
        <g id="zones"></g><g id="groups"></g><g id="edges"></g><g id="nodes"></g><g id="marks"></g>
        <g id="dot" class="hidden"><circle class="halo" r="18"/><circle class="body" r="11"/><text class="label">•</text></g>
      </g>
    </svg>
    <div id="stamp"><b>{{STAMPB}}</b>{{STAMP}}</div>
    <div id="bubble" class="hidden"><button class="close" title="Close (Esc)">×</button><div class="text"></div></div>
    <div class="hint">Drag to move · wheel to zoom · click or right-click a component</div>
    <div class="zoom"><button class="btn" id="z-out" title="Zoom out">−</button><button class="btn" id="z-in" title="Zoom in">+</button><button class="btn" id="z-fit" title="See everything (F)">Fit</button><button class="btn" id="z-follow" title="Off: the view stays where you put it (Fit shows everything). On: the view follows the journey">Follow: off</button></div>
  </div>
  <aside id="panel"><div class="bar"><button class="btn" id="p-back" title="Back" disabled>←</button><span class="title" id="p-title"></span><button class="btn" id="p-journey" title="Back to the current stop">Current stop</button></div><div class="body" id="p-body"></div></aside>
</main>
<footer>
  <div class="ctl"><button class="btn" id="b-first" title="First stop (Home)">⏮</button><button class="btn" id="b-prev" title="Previous stop (←)">◀</button><button class="btn primary" id="b-play" title="Play or pause (space)">▶ Play</button><button class="btn" id="b-next" title="Next stop (→)">▶</button><select class="btn" id="speed" title="Pace"><option value="slow">slow</option><option value="normal" selected>normal</option><option value="fast">fast</option></select></div>
  <div class="story"><div class="where" id="f-where"></div><div class="say" id="f-say"></div></div>
  <div class="progress" id="progress"></div>
</footer>
<div id="menu"></div>
<div id="modal"><div class="frame"><div class="hd"><h2 id="m-title"></h2><button class="btn" id="m-close">Close (Esc)</button></div><div class="content" id="m-content"></div></div></div>
<div class="tip" id="tip"></div>
<script>window.PAGE = "{{PAGE}}";</script>
<script>
{{DATA}}
</script>
<script>
{{ENGINE}}
</script>
</body>
</html>
